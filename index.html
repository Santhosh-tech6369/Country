<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <style>
        /* Ensure full page coverage */
        html {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background-image: url('./Musical.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial Narrow Bold', sans-serif;
            color: #fff;
        }

        .container {
            width: 400px;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 25px rgba(3, 174, 247, 0.9);
            border-radius: 10px;
            animation: slideUp 1s ease-out;
            position: relative;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px) rotateX(30deg);
                opacity: 0;
            }
            to {
                transform: translateY(0) rotateX(0);
                opacity: 1;
            }
        }

        .head h2 {
            color: aqua;
            text-align: center;
            margin: 0 0 20px;
            animation: fadeIn 1s ease-in 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            color: antiquewhite;
            display: block;
            margin-top: 10px;
            animation: fadeIn 1s ease-in 0.8s both;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: none;
            border-bottom: 2px solid white;
            color: aqua;
            font-size: 17px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
            animation: fadeIn 1s ease-in 1s both;
        }

        input:focus {
            outline: none;
            border-bottom-color: #00ffff;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        button {
            color: rgb(9, 236, 236);
            background-color: transparent;
            border: 2px solid aqua;
            padding: 10px;
            margin-top: 30px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 1s ease-in 1.3s both;
        }

        button:hover {
            background-color: rgba(0, 255, 255, 0.2);
            box-shadow: inset 0 0 5px aqua, 0 0 20px rgba(0, 255, 71, 0.6);
            transform: translateY(-2px);
        }

        /* Error & Success Styles */
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            visibility: hidden;
            height: 16px;
        }

        .input-group.error .error-message {
            visibility: visible;
        }

        .input-group.error input {
            color: red;
            border-bottom-color: red !important;
        }

        .input-group.success input {
            border-bottom-color: rgb(3, 187, 58);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 30px;
            }
            input, button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="head">
            <h2>Register</h2>
        </div>

        <form id="form">
            <!-- Username -->
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Name" />
                <div class="error-message"></div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Email" />
                <div class="error-message"></div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" />
                <div class="error-message"></div>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <label for="cpassword">Confirm Password</label>
                <input type="password" id="cpassword" placeholder="Confirm Password" />
                <div class="error-message"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit">Next</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const cpassword = document.getElementById('cpassword');

        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent default until validation
            if (validateInputs()) {
                // Redirect on success
                window.location.href = "country.html";
            }
        });

        function validateInputs() {
            let success = true;

            const usernameVal = username.value.trim();
            const emailVal = email.value.trim();
            const passwordVal = password.value.trim();
            const cpasswordVal = cpassword.value.trim();

            // Username
            if (usernameVal === '') {
                setError(username, 'Username is required');
                success = false;
            } else if (usernameVal.length < 3) {
                setError(username, 'Username must be at least 3 characters');
                success = false;
            } else {
                setSuccess(username);
            }

            // Email
            if (emailVal === '') {
                setError(email, 'Email is required');
                success = false;
            } else if (!validateEmail(emailVal)) {
                setError(email, 'Please enter a valid email');
                success = false;
            } else {
                setSuccess(email);
            }

            // Password
            if (passwordVal === '') {
                setError(password, 'Password is required');
                success = false;
            } else if (passwordVal.length < 4) {
                setError(password, 'Password must be at least 4 characters');
                success = false;
            } else {
                setSuccess(password);
            }

            // Confirm Password
            if (cpasswordVal === '') {
                setError(cpassword, 'Please confirm your password');
                success = false;
            } else if (cpasswordVal !== passwordVal) {
                setError(cpassword, 'Passwords do not match');
                success = false;
            } else {
                setSuccess(cpassword);
            }

            return success;
        }

        function setError(element, message) {
            const inputGroup = element.parentElement;
            const errorElement = inputGroup.querySelector('.error-message');

            errorElement.innerText = message;
            inputGroup.classList.add('error');
            inputGroup.classList.remove('success');
        }

        function setSuccess(element) {
            const inputGroup = element.parentElement;
            const errorElement = inputGroup.querySelector('.error-message');

            errorElement.innerText = '';
            inputGroup.classList.add('success');
            inputGroup.classList.remove('error');
        }

        function validateEmail(email) {
            return String(email)
                .toLowerCase()
                .match(
                    /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
                );
        }
    </script>
</body>
</html>
